{% extends "base.html" %}
{% load static %}

{% block body_class %}template-contactpage{% endblock %}

{% block content %}

<section class="bg-gradient-to-br from-primary to-primary-dark text-white py-16 text-center">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl md:text-5xl font-bold">{{ page.heading }}</h1>
    </div>
</section>

<section class="py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="text-center p-8 bg-gray-50 rounded-lg">
                <div class="w-12 h-12 mx-auto mb-4 text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold mb-4">Mailing Address</h2>
                <address class="not-italic text-gray-700">{{ page.mailing_address|linebreaks }}</address>
            </div>

            <div class="text-center p-8 bg-gray-50 rounded-lg">
                <div class="w-12 h-12 mx-auto mb-4 text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold mb-4">Phone</h2>
                <p><a href="tel:{{ page.phone_number|cut:' '|cut:'('|cut:')'|cut:'-' }}" class="text-primary hover:text-primary-dark hover:underline">{{ page.phone_number }}</a></p>
            </div>

            <div class="text-center p-8 bg-gray-50 rounded-lg">
                <div class="w-12 h-12 mx-auto mb-4 text-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-full h-full">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-semibold mb-4">Email</h2>
                <p><a href="mailto:{{ page.email }}" class="text-primary hover:text-primary-dark hover:underline">{{ page.email }}</a></p>
            </div>
        </div>
    </div>
</section>

{% endblock content %}
